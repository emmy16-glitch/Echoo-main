<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <title>Echoo</title>
    <link rel="stylesheet" href="./src/splash.css" />
  </head>
  <body>
    <main aria-label="Echoo is opening">
      <svg class="echoo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="echoo-primary-highlight" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".68" />
            <stop offset=".48" stop-color="#ffffff" stop-opacity=".08" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="echoo-secondary-highlight" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
            <stop offset=".5" stop-color="#ffffff" stop-opacity=".1" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <filter id="echoo-depth-shadow" x="-30%" y="-30%" width="170%" height="180%">
            <feGaussianBlur stdDeviation=".72" />
          </filter>
        </defs>
        <g class="echoo-mark-shadows" filter="url(#echoo-depth-shadow)">
          <ellipse cx="12.5" cy="11.2" rx="10.2" ry="6.8" transform="rotate(-31 12.5 11.2)" />
          <ellipse cx="19.5" cy="20.8" rx="10.2" ry="6.8" transform="rotate(-31 19.5 20.8)" />
        </g>
        <g class="echoo-mark-primary">
          <ellipse cx="12.5" cy="11.2" rx="10.2" ry="6.8" transform="rotate(-31 12.5 11.2)" />
          <ellipse class="echoo-mark-highlight" cx="12.5" cy="11.2" rx="10.2" ry="6.8" transform="rotate(-31 12.5 11.2)" fill="url(#echoo-primary-highlight)" />
        </g>
        <g class="echoo-mark-echo">
          <ellipse cx="19.5" cy="20.8" rx="10.2" ry="6.8" transform="rotate(-31 19.5 20.8)" />
          <ellipse class="echoo-mark-highlight" cx="19.5" cy="20.8" rx="10.2" ry="6.8" transform="rotate(-31 19.5 20.8)" fill="url(#echoo-secondary-highlight)" />
        </g>
      </svg>
      <span class="echoo-status">Opening</span>
    </main>
  </body>
</html>
