<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Echoo</title>
    <link rel="stylesheet" href="./src/offline.css" />
  </head>
  <body>
    <main>
      <img src="./assets/generated/icon.png" alt="" />
      <h1>Echoo couldn&rsquo;t finish starting</h1>
      <p>Your local Echoo interface did not become ready. You can try loading it again or restart Echoo.</p>
      <div class="echoo-recovery-actions">
        <button id="retry" type="button">Try again</button>
        <button id="restart" class="echoo-secondary-action" type="button">Restart Echoo</button>
      </div>
      <button id="diagnostics" class="echoo-diagnostics-action" type="button">Open diagnostics</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./src/offline.js"></script>
  </body>
</html>
