server {
    # Cloudflare Tunnel is the only public entry point. Do not expose this
    # listener directly to the internet.
    listen 127.0.0.1:8165;
    server_name echoo.digi02.org;

    root /home/digihosting/Documents/Apzs/Echoo-main/frontend/dist;
    index index.html;
    client_max_body_size 4g;
    client_body_timeout 15m;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;

    location /api/internal/livekit-recording {
        proxy_pass http://127.0.0.1:5064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The API enforces the protected audio-stream rules under this path.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5064;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
