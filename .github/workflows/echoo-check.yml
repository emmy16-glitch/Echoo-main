name: Echoo checks

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium and Firefox for Playwright
        run: npx playwright install --with-deps chromium firefox
      - name: Run responsive and end-to-end browser audit
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  whisper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echoo-whisper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Whisper service modules
        run: python -m py_compile app.py model_loader.py websocket_server.py whisper_worker.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check API and broadcast audio entrypoints
        run: |
          node --check src/app.js
          node --check src/config/jwt.js
          node --check src/routes/index.js
          node --check src/routes/authRoutes.js
          node --check src/routes/userRoutes.js
          node --check src/routes/settingsRoutes.js
          node --check src/routes/searchRoutes.js
          node --check src/routes/broadcastRoutes.js
          node --check src/routes/audioRoutes.js
          node --check src/routes/stationRoutes.js
          node --check src/routes/transcriptRoutes.js
          node --check src/routes/commentRoutes.js
          node --check src/controllers/authController.js
          node --check src/controllers/settingsController.js
          node --check src/controllers/studioController.js
          node --check src/controllers/audioLikeController.js
          node --check src/controllers/audioStreamController.js
          node --check src/controllers/audioDownloadController.js
          node --check src/controllers/broadcastController.js
          node --check src/controllers/broadcastLifecycleController.js
          node --check src/controllers/broadcastPresenceController.js
          node --check src/controllers/broadcastChunkController.js
          node --check src/controllers/broadcastProcessingController.js
          node --check src/controllers/transcriptSearchController.js
          node --check src/controllers/advancedPlayerController.js
          node --check src/controllers/playerController.js
          node --check src/controllers/historyController.js
          node --check src/controllers/listenerController.js
          node --check src/controllers/chatController.js
          node --check src/controllers/commentController.js
          node --check src/controllers/downloadsController.js
          node --check src/controllers/playlistController.js
          node --check src/controllers/searchController.js
          node --check src/controllers/contentController.js
          node --check src/controllers/followController.js
          node --check src/models/Audio.js
          node --check src/models/Comment.js
          node --check src/models/Playlist.js
          node --check src/models/BroadcastAudioChunk.js
          node --check src/models/BroadcastProcessingJob.js
          node --check src/models/TranscriptSegment.js
          node --check src/providers/livekit.js
          node --check src/services/audioAccess.js
          node --check src/services/audioStreamAccess.js
          node --check src/services/broadcastAudioReadiness.js
          node --check src/services/broadcastProcessingService.js
          node --check src/services/transcriptQualityService.js
          node --check src/services/transcriptionGateway.js
          node --check src/services/creatorBroadcastLease.js
          node --check src/middleware/auth.js
          node --check src/middleware/audioDownloadAccess.js
          node --check src/middleware/rateLimiter.js
          node --check src/middleware/stationDeletionGuard.js
          node --check src/middleware/enforceSingleLiveCreator.js
          node --check src/middleware/broadcastQueryValidation.js
          node --check src/utils/queryText.js
      - name: Run backend invariant and failure tests
        run: npm test
