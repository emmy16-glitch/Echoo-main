name: Echoo checks

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check API and broadcast audio entrypoints
        run: |
          node --check src/app.js
          node --check src/config/jwt.js
          node --check src/routes/index.js
          node --check src/routes/authRoutes.js
          node --check src/routes/settingsRoutes.js
          node --check src/routes/searchRoutes.js
          node --check src/routes/broadcastRoutes.js
          node --check src/routes/audioRoutes.js
          node --check src/routes/stationRoutes.js
          node --check src/controllers/authController.js
          node --check src/controllers/settingsController.js
          node --check src/controllers/studioController.js
          node --check src/controllers/audioStreamController.js
          node --check src/controllers/broadcastController.js
          node --check src/controllers/broadcastLifecycleController.js
          node --check src/controllers/broadcastPresenceController.js
          node --check src/controllers/advancedPlayerController.js
          node --check src/controllers/playerController.js
          node --check src/controllers/historyController.js
          node --check src/controllers/listenerController.js
          node --check src/controllers/chatController.js
          node --check src/controllers/commentController.js
          node --check src/controllers/downloadsController.js
          node --check src/controllers/playlistController.js
          node --check src/controllers/searchController.js
          node --check src/controllers/contentController.js
          node --check src/controllers/followController.js
          node --check src/models/Audio.js
          node --check src/models/Playlist.js
          node --check src/providers/livekit.js
          node --check src/services/audioAccess.js
          node --check src/services/audioStreamAccess.js
          node --check src/services/broadcastAudioReadiness.js
          node --check src/services/creatorBroadcastLease.js
          node --check src/middleware/auth.js
          node --check src/middleware/rateLimiter.js
          node --check src/middleware/enforceSingleLiveCreator.js
          node --check src/middleware/broadcastQueryValidation.js
          node --check src/utils/queryText.js
      - name: Run backend invariant tests
        run: npm test
