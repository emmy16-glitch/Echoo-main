name: Echoo checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-dependency-audit-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Update vulnerable backend dependencies
        working-directory: backend
        run: npm install --save express@4.22.3 multer@2.4.0
      - name: Patch remaining transitive audit findings
        working-directory: backend
        run: npm audit fix
      - name: Verify audit
        working-directory: backend
        run: npm audit
      - name: Commit dependency lockfile
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "Fix backend npm audit vulnerabilities"
          git push origin HEAD:fix/backend-dependency-audit-20260928
