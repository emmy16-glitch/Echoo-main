name: Prepare Listener V2 LiveKit dependencies

on:
  push:
    branches:
      - integration/listener-mobile-v2
    paths:
      - '.github/workflows/listener-livekit-deps.yml'

permissions:
  contents: write

jobs:
  sync-livekit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/listener-mobile-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo LiveKit native dependencies
        working-directory: mobile
        run: npm install @livekit/react-native-expo-plugin@^1.0.1 @livekit/react-native-webrtc@^144.1.2
      - name: Commit synchronized dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already synchronized."
            exit 0
          fi
          git commit -m "Install Listener V2 LiveKit Expo dependencies"
          git push origin HEAD:integration/listener-mobile-v2
