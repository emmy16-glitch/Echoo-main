name: Build/Release Desktop App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Warm Electron runtime
        if: runner.os == 'Linux'
        run: |
          cd desktop
          npx electron --no-sandbox --version

      - name: Verify Electron desktop shell
        if: runner.os == 'Linux'
        run: |
          cd desktop
          xvfb-run -a npm test
        env:
          ECHOO_TEST_NO_SANDBOX: '1'
          ECHOO_TEST_DISABLE_GPU: '1'
          ECHOO_TEST_HEADLESS: '1'

      - name: Build Electron app
        run: |
          cd desktop
          npm run build -- --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
