name: Build/Release Desktop App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Warm Electron runtime
        if: runner.os == 'Linux'
        run: |
          cd desktop
          npx electron --no-sandbox --version

      - name: Verify Electron desktop shell
        if: runner.os == 'Linux'
        run: |
          cd desktop
          xvfb-run -a npm test
        env:
          ECHOO_TEST_NO_SANDBOX: '1'
          ECHOO_TEST_DISABLE_GPU: '1'
          ECHOO_TEST_HEADLESS: '1'

      - name: Build Electron app
        run: |
          cd desktop
          npm run build -- --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Platform-specific signing credentials are intentionally optional so
          # verified unsigned builds remain available while certificates are
          # being provisioned. When the matching secrets are configured, the
          # electron-builder environment contract enables signing automatically.
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Report signing configuration
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" && -n "${WIN_CSC_LINK:-}" ]]; then
            echo 'Windows Authenticode signing credentials are configured.'
          elif [[ "${RUNNER_OS}" == "macOS" && -n "${MAC_CSC_LINK:-}" && -n "${APPLE_API_KEY:-}" ]]; then
            echo 'macOS signing and notarization credentials are configured.'
          else
            echo 'No complete signing configuration is present; this build is unsigned.'
          fi
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Record macOS distribution manifest
        if: runner.os == 'macOS'
        run: |
          cd desktop
          dmg=$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          test -s "$dmg"
          printf '%s\n' '--- macOS distributable manifest ---'
          ls -lh "$dmg"
          shasum -a 256 "$dmg"
          file "$dmg"

      - name: Retain packaged desktop artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: echoo-desktop-${{ runner.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
