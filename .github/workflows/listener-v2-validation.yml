# validation pass 4 - branch closing validation
name: Validate Listener Mobile V2

on:
  push:
    branches:
      - integration/listener-mobile-v2
    paths:
      - '.github/workflows/listener-v2-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/listener-mobile-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Run mobile validation and write report
        id: validate
        shell: bash
        run: |
          set +e
          cd mobile

          npm ci > /tmp/echoo-npm-ci.log 2>&1
          NPM_CI=$?

          if [ "$NPM_CI" -eq 0 ]; then
            npm run lint > /tmp/echoo-lint.log 2>&1
            LINT=$?
            npx tsc --noEmit > /tmp/echoo-tsc.log 2>&1
            TSC=$?
            npx expo config --type public > /tmp/echoo-expo-config.log 2>&1
            EXPO_CONFIG=$?
          else
            LINT=99
            TSC=99
            EXPO_CONFIG=99
            echo "Skipped because npm ci failed." > /tmp/echoo-lint.log
            echo "Skipped because npm ci failed." > /tmp/echoo-tsc.log
            echo "Skipped because npm ci failed." > /tmp/echoo-expo-config.log
          fi

          cd ..
          {
            echo "# Echoo Listener Mobile V2 Validation"
            echo
            echo "Generated by GitHub Actions for commit \`$GITHUB_SHA\`."
            echo
            echo "| Check | Exit code |"
            echo "| --- | ---: |"
            echo "| npm ci | $NPM_CI |"
            echo "| npm run lint | $LINT |"
            echo "| npx tsc --noEmit | $TSC |"
            echo "| npx expo config --type public | $EXPO_CONFIG |"
            echo
            echo "## npm ci"
            echo '```text'
            tail -n 50 /tmp/echoo-npm-ci.log
            echo '```'
            echo
            echo "## lint"
            echo '```text'
            tail -n 80 /tmp/echoo-lint.log
            echo '```'
            echo
            echo "## TypeScript"
            echo '```text'
            tail -n 100 /tmp/echoo-tsc.log
            echo '```'
            echo
            echo "## Expo config"
            echo '```text'
            tail -n 60 /tmp/echoo-expo-config.log
            echo '```'
          } > mobile/LISTENER_V2_VALIDATION.md

          echo "npm_ci=$NPM_CI" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "tsc=$TSC" >> "$GITHUB_OUTPUT"
          echo "expo_config=$EXPO_CONFIG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/LISTENER_V2_VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Listener V2 validation results"
            git push origin HEAD:integration/listener-mobile-v2
          fi
      - name: Enforce validation result
        run: |
          test "${{ steps.validate.outputs.npm_ci }}" = "0"
          test "${{ steps.validate.outputs.lint }}" = "0"
          test "${{ steps.validate.outputs.tsc }}" = "0"
          test "${{ steps.validate.outputs.expo_config }}" = "0"
