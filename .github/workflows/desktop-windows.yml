name: Echoo Windows desktop

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/src/app.js'
      - 'backend/src/config/env.js'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'frontend/**'
      # The packaged renderer talks directly to the shared Echoo API/Socket.IO.
      # Re-run Windows verification when the exact desktop-origin/CORS contract
      # or its environment parsing changes, even if desktop/ itself did not.
      - 'backend/src/app.js'
      - 'backend/src/config/env.js'
      - '.github/workflows/desktop-windows.yml'

concurrency:
  group: echoo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Audit packaged production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix desktop

      - name: Test desktop security and package contracts
        run: npm test --prefix desktop

      - name: Test desktop authentication recovery
        run: npm run test:desktop-auth --prefix frontend

      - name: Build and verify local renderer
        run: |
          npm run build:renderer --prefix desktop
          npm run verify:bundle --prefix desktop

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win --prefix desktop -- --publish never
        env:
          NODE_ENV: production
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Run packaged Electron Playwright E2E
        run: npm run test:e2e:packaged --prefix desktop

      - name: Install and launch packaged Echoo
        shell: powershell
        run: ./desktop/scripts/verify-installer.ps1 -InstallSmokeTest

      - name: Verify signing state
        shell: powershell
        env:
          HAS_SIGNING_CERTIFICATE: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          $installer = Get-ChildItem desktop/dist/Echoo-Setup-*-x64.exe | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer is missing before signing verification.'
          }

          if ($env:HAS_SIGNING_CERTIFICATE -eq 'true') {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Windows installer Authenticode signature is $($signature.Status), not Valid."
            }
            Write-Host "Verified valid Authenticode signature from $($signature.SignerCertificate.Subject)."
          } else {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned Windows installer but Authenticode status is $($signature.Status)."
            }
            Write-Warning 'Windows installer is unsigned because WIN_CSC_LINK is not configured. Windows may display "Unknown publisher".'
            Write-Host "Authenticode: UNSIGNED / $($signature.Status)"
          }

      - name: Verify installed v2.0.5 to v2.0.6 upgrade preserves user data
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: ./desktop/scripts/verify-upgrade.ps1

      - name: Upload verified Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: echoo-windows-x64
          path: |
            desktop/dist/Echoo-Setup-*-x64.exe
            desktop/dist/Echoo-Setup-*-x64.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Release v2.0.6 only after desktop and main checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw -LiteralPath desktop/package.json | ConvertFrom-Json
          if ($package.version -ne '2.0.6') {
            Write-Host "No automated release requested for version $($package.version)."
            exit 0
          }

          $required = @('Echoo checks', 'Echoo Architecture Check')
          $ready = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $payload = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to verify required checks.' }
            $allRuns = ($payload | ConvertFrom-Json).workflow_runs
            $found = @()
            foreach ($name in $required) {
              $run = $allRuns | Where-Object { $_.name -eq $name -and $_.head_sha -eq $env:GITHUB_SHA } |
                Sort-Object created_at -Descending | Select-Object -First 1
              if ($run -and $run.status -eq 'completed' -and $run.conclusion -ne 'success') {
                throw "Cannot publish v2.0.6: $name concluded $($run.conclusion)."
              }
              if ($run -and $run.status -eq 'completed' -and $run.conclusion -eq 'success') {
                $found += $name
              }
            }
            if ($found.Count -eq $required.Count) {
              $ready = $true
              break
            }
            Write-Host "Waiting for main-commit checks ($($found.Count)/$($required.Count))..."
            Start-Sleep -Seconds 8
          }
          if (-not $ready) { throw 'Required main-commit CI checks did not complete in time.' }

          $tag = "v$($package.version)"
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing GitHub releases.' }
          $existing = $releaseJson | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "$tag already exists; leaving it unchanged."
            exit 0
          }

          $files = @(
            "desktop/dist/Echoo-Setup-$($package.version)-x64.exe",
            "desktop/dist/Echoo-Setup-$($package.version)-x64.exe.blockmap",
            "desktop/dist/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Cannot publish release without $file."
            }
          }

          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title "Echoo $tag" --notes "Windows desktop maintenance release: Echoo Library mixer import, WebAssembly MP3 export, permanent station identity, Windows updater restart handling, and packaged regression tests. Installer unsigned; Windows SmartScreen may warn."
          if ($LASTEXITCODE -ne 0) { throw "Publishing $tag failed." }
          Write-Host "Published $tag after all required checks passed."

      - name: Publish verified tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/dist/Echoo-Setup-*-x64.exe
            desktop/dist/Echoo-Setup-*-x64.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
