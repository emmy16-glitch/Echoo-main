name: Echoo Windows desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/desktop-windows.yml'

concurrency:
  group: echoo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Test desktop security and package contracts
        run: npm test --prefix desktop

      - name: Build and verify local renderer
        run: |
          npm run build:renderer --prefix desktop
          npm run verify:bundle --prefix desktop

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win --prefix desktop -- --publish never
        env:
          NODE_ENV: production
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Run packaged Electron Playwright E2E
        run: npm run test:e2e:packaged --prefix desktop

      - name: Install and launch packaged Echoo
        shell: powershell
        run: ./desktop/scripts/verify-installer.ps1 -InstallSmokeTest

      - name: Report signing state
        shell: powershell
        run: |
          if ('${{ secrets.WIN_CSC_LINK }}') {
            Write-Host 'Authenticode signing credentials were supplied.'
          } else {
            Write-Warning 'Installer is unsigned because WIN_CSC_LINK was not configured.'
          }

      - name: Upload verified Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: echoo-windows-2.0.0-x64
          path: |
            desktop/dist/Echoo-Setup-2.0.0-x64.exe
            desktop/dist/Echoo-Setup-2.0.0-x64.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/Echoo-Setup-2.0.0-x64.exe
            desktop/dist/Echoo-Setup-2.0.0-x64.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
