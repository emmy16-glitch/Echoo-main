name: Echoo Windows desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/src/app.js'
      - 'backend/src/config/env.js'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'frontend/**'
      # The packaged renderer talks directly to the shared Echoo API/Socket.IO.
      # Re-run Windows verification when the exact desktop-origin/CORS contract
      # or its environment parsing changes, even if desktop/ itself did not.
      - 'backend/src/app.js'
      - 'backend/src/config/env.js'
      - '.github/workflows/desktop-windows.yml'

concurrency:
  group: echoo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Audit packaged production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix desktop

      - name: Test desktop security and package contracts
        run: npm test --prefix desktop

      - name: Build and verify local renderer
        run: |
          npm run build:renderer --prefix desktop
          npm run verify:bundle --prefix desktop

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win --prefix desktop -- --publish never
        env:
          NODE_ENV: production
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Run packaged Electron Playwright E2E
        run: npm run test:e2e:packaged --prefix desktop

      - name: Install and launch packaged Echoo
        shell: powershell
        run: ./desktop/scripts/verify-installer.ps1 -InstallSmokeTest

      - name: Report signing state
        shell: powershell
        run: |
          if ('${{ secrets.WIN_CSC_LINK }}') {
            Write-Host 'Authenticode signing credentials were supplied.'
          } else {
            Write-Warning 'Installer is unsigned because WIN_CSC_LINK was not configured.'
          }

      - name: Upload verified Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: echoo-windows-x64
          path: |
            desktop/dist/Echoo-Setup-*-x64.exe
            desktop/dist/Echoo-Setup-*-x64.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Detect unreleased desktop version
        id: release_state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-Content -LiteralPath './desktop/package.json' -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$([uri]::EscapeDataString($tag))"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "Echoo-Windows-Release"
          }
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $releaseUri -Headers $headers -Method Get -ErrorAction Stop | Out-Null
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $tag already exists; leaving it unchanged."
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) {
              throw
            }
            "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $tag does not exist and will be published after verification."
          }

      - name: Publish verified main Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_state.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_state.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Echoo Desktop ${{ steps.release_state.outputs.tag }}
          files: |
            desktop/dist/Echoo-Setup-*-x64.exe
            desktop/dist/Echoo-Setup-*-x64.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/Echoo-Setup-*-x64.exe
            desktop/dist/Echoo-Setup-*-x64.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
