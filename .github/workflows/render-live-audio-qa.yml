name: Echoo Render remote QA

on:
  push:
    branches:
      - qa/render-final-audio

concurrency:
  group: echoo-render-remote-qa
  cancel-in-progress: true

jobs:
  remote-live-audio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Render live-audio QA
        env:
          ECHOO_REMOTE_ORIGIN: https://echoo-render-staging.onrender.com
        run: node scripts/remote-live-audio-e2e.mjs
