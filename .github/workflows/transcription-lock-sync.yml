name: Transcription lockfile sync

on:
  push:
    branches:
      - feat/parakeet-gemini-transcription

permissions:
  contents: write

jobs:
  sync-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/parakeet-gemini-transcription
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- frontend/package-lock.json backend/package-lock.json; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          git commit -m "chore(transcription): synchronize npm lockfiles"
          git push origin HEAD:feat/parakeet-gemini-transcription
