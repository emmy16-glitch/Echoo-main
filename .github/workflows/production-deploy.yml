name: Echoo production deploy

on:
  workflow_run:
    workflows:
      - Echoo checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: Optional main-branch commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: echoo-production-deploy
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}

    steps:
      - name: Resolve deploy SHA
        id: resolve
        env:
          MANUAL_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_SHA" ]; then
            echo "deploy_sha=$MANUAL_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify commit belongs to main
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: sha,
              head: branch.data.commit.sha,
            });

            if (!['identical', 'ahead'].includes(comparison.data.status)) {
              core.setFailed(`Commit ${sha} is not contained in main`);
            }

      - name: Wait for Echoo Architecture Check at same commit
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.deploy_sha }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const { owner, repo } = context.repo;

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                per_page: 100,
              });

              const architecture = runs.data.workflow_runs.find(
                run => run.name === 'Echoo Architecture Check'
              );

              if (architecture?.status === 'completed') {
                if (architecture.conclusion !== 'success') {
                  core.setFailed(
                    `Echoo Architecture Check concluded ${architecture.conclusion}`
                  );
                } else {
                  core.info('Echoo Architecture Check passed.');
                }
                return;
              }

              core.info(`Architecture check not complete yet (attempt ${attempt}/30)`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            core.setFailed('Timed out waiting for Echoo Architecture Check.');

  deploy:
    needs: gate
    runs-on:
      - self-hosted
      - Linux
      - X64
      - echoo-production
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}

      - name: Deploy exact tested commit
        run: bash scripts/deploy-production.sh "${{ needs.gate.outputs.deploy_sha }}"
