name: Echoo Architecture Check

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check duplicate, mock and synthetic-data architecture
        run: node scripts/architecture-check.mjs

      - name: Check runtime, auth and media architecture
        run: node scripts/runtime-architecture-check.mjs
