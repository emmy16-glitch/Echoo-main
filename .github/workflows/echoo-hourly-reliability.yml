name: Echoo hourly recording and streaming reliability

# These checks run on source and synthetic media in GitHub runners. They never
# send data to the live Echoo backend or alter production broadcasts or files.
# Scheduled runs are paused at the user's request; manual dispatch remains available.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/echoo-hourly-reliability.yml'
      - 'backend/**'
      - 'frontend/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/echoo-hourly-reliability.yml'

permissions:
  contents: read

concurrency:
  group: echoo-hourly-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recording-recovery:
    name: Recording, persistence and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout immutable run revision
        uses: actions/checkout@v7
      - name: Node 20 and dependency cache
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts=false
      - name: Install real FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify available codecs and probe
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep libmp3lame
      - name: Backend complete regression suite
        env:
          NODE_ENV: test
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
        run: npm test
      - name: Repeat failure-injection and multi-broadcast stress tests
        env:
          NODE_ENV: test
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
        run: |
          set -euo pipefail
          for iteration in 1 2 3; do
            echo "Echoo recorder/recovery repeat ${iteration}/3"
            node --test --test-concurrency=3 \\
              test/livekitServerRecording.test.js \\
              test/recoveryEncoderExit.test.js \\
              test/recoveryOutputWriteQueue.test.js \\
              test/recoveryChunkTimeline.test.js \\
              test/broadcastProcessingAdmission.test.js \\
              test/serverRecordingReconstruction.test.js \\
              test/broadcastRecordingProgressController.test.js \\
              test/serverRecordingPreservation.test.js
          done

  listener-and-local-recovery:
    name: Realtime listener and browser recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout immutable run revision
        uses: actions/checkout@v7
      - name: Node 22 for LiveKit-compatible frontend
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify publisher and listener reconnect policies
        run: |
          npm run test:live-recovery
          npm run test:realtime-identity
          npm run test:player-resources
          npm run test:listener-route
      - name: Verify OPFS WAV/MP3 save and download integrity
        run: |
          npm run test:local-recording
          npm run test:download-integrity
          npm run test:desktop-auth
      - name: Test persistent OPFS recovery after refresh
        run: node --test src/services/longRecordingRecovery.test.mjs

  hourly-summary:
    name: Reliability result gate
    if: always()
    needs:
      - recording-recovery
      - listener-and-local-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail visibly when any reliability job failed or was cancelled
        env:
          RECORDING: ${{ needs.recording-recovery.result }}
          LISTENER: ${{ needs.listener-and-local-recovery.result }}
        run: |
          echo "Recorder/recovery: $RECORDING"
          echo "Listener/browser recovery: $LISTENER"
          {
            echo "## Echoo offline reliability check"
            echo "- Recorder/recovery: **$RECORDING**"
            echo "- Listener/browser recovery: **$LISTENER**"
            echo "- Tested commit: ${GITHUB_SHA}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo ""
            echo "Synthetic tests do not certify production LiveKit, cloud storage, 500 listeners, or 7–9-hour broadcasts."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RECORDING" = success
          test "$LISTENER" = success
